# 이 설정은 Codex가 기본적으로 어떤 모델로 작업할지 정합니다.
# 현재 값 `gpt-5.4-mini`는 빠른 응답과 충분한 품질의 균형을 노린 선택입니다.
# 다른 값으로는 예를 들어 더 강한 추론용 모델이나 더 가벼운 모델을 둘 수 있습니다.
# 값을 높이면 복잡한 작업의 안정성이 좋아지지만 속도와 비용이 늘 수 있고, 낮추면 더 빠르지만 정밀도가 떨어질 수 있습니다.
model = "gpt-5.4-mini"

# 이 설정은 일반 작업에서 사용할 추론 강도를 조절합니다.
# 현재 값 `medium`은 속도와 사고 깊이의 균형을 맞춘 수준입니다.
# 다른 값으로는 `low`나 `high`가 있으며, 간단한 수정에는 낮게, 복잡한 문제 해결에는 높게 둘 수 있습니다.
# 높이면 답변의 검토와 판단이 더 신중해지지만 느려질 수 있고, 낮추면 더 빠르지만 놓치는 부분이 생길 수 있습니다.
model_reasoning_effort = "medium"

# 이 설정은 계획을 세우는 단계에서 사용할 추론 강도를 따로 정합니다.
# 현재 값 `high`는 작업 분해와 순서 설계를 더 꼼꼼하게 하도록 돕습니다.
# 다른 값으로는 `low`와 `medium`이 있으며, 단순한 작업에서는 낮춰도 됩니다.
# 값을 높이면 계획 품질이 좋아지지만 준비 시간이 늘 수 있고, 낮추면 빠르지만 계획이 거칠어질 수 있습니다.
plan_mode_reasoning_effort = "high"

# 이 설정은 Codex가 어떤 샌드박스 권한 범위에서 작업할지 제어합니다.
# 현재 값 `workspace-write`는 작업 공간 안에서는 수정이 가능하되, 그 밖의 영역은 제한하는 뜻입니다.
# 다른 값으로는 더 엄격한 읽기 전용 환경이나 더 넓은 권한 모드가 있을 수 있습니다.
# 권한을 높이면 할 수 있는 작업이 늘지만 위험도 함께 커지고, 낮추면 안전하지만 일부 작업은 막힐 수 있습니다.
sandbox_mode = "workspace-write"

# 이 설정은 승인 절차가 필요한 작업을 어떻게 처리할지 정합니다.
# 현재 값 `on-request`는 필요할 때마다 권한 승인을 요청하는 방식입니다.
# 다른 값으로는 더 자동화된 승인 정책이나 더 보수적인 정책이 있을 수 있습니다.
# 정책을 완화하면 진행은 빨라지지만 위험한 작업이 늘 수 있고, 더 엄격하게 두면 안전하지만 멈춤이 잦아질 수 있습니다.
approval_policy = "on-request"

[features]
hooks = true

# 아래 항목들은 병렬 처리 폭과 작업 깊이, 개별 작업의 최대 실행 시간을 조절합니다.
# 현재 값은 이 저장소에서 여러 작업을 동시에 다루되 너무 깊게 파고들지 않고, 각 작업을 일정 시간 안에 끝내도록 맞춘 상태입니다.
# 더 큰 값은 더 많은 병렬 처리나 더 긴 실행 시간을 허용하지만 자원 사용과 지연이 늘 수 있습니다.
# 더 작은 값은 더 보수적으로 동작해 안전할 수 있지만 처리량이 줄어들 수 있습니다.
[agents]

# 이 설정은 동시에 돌릴 수 있는 작업자 수를 제한합니다.
# 현재 값 `4`는 여러 작은 작업을 병렬로 처리하면서도 과도한 분산을 피하는 수준입니다.
# 다른 값으로는 `1`처럼 직렬에 가깝게 둘 수도 있고, 더 큰 수로 더 많은 병렬 처리를 허용할 수도 있습니다.
# 값을 높이면 처리 속도는 오를 수 있지만 충돌과 자원 경쟁이 늘고, 낮추면 안정적이지만 느려질 수 있습니다.
max_threads = 4

# 이 설정은 작업이 얼마나 깊게 연쇄적으로 분기될 수 있는지 정합니다.
# 현재 값 `1`은 불필요한 하위 분기를 억제해 단순하고 예측 가능한 흐름을 유지합니다.
# 다른 값으로는 `0`에 가까운 매우 제한적인 모드나, 더 깊은 탐색을 허용하는 큰 값이 있습니다.
# 값을 높이면 더 많은 하위 작업을 다룰 수 있지만 복잡도가 커지고, 낮추면 구조가 단순해지지만 탐색 폭이 줄어듭니다.
max_depth = 1

# 이 설정은 개별 작업이 중단되기 전까지 허용되는 최대 실행 시간을 정합니다.
# 현재 값 `1800`은 한 작업을 최대 30분 정도까지 허용하는 의미입니다.
# 다른 값으로는 더 짧은 시간이나 더 긴 시간을 둘 수 있습니다.
# 값을 높이면 긴 작업이 끝날 가능성이 커지지만 지연이 늘고, 낮추면 빨리 실패를 감지하지만 큰 작업이 끊길 수 있습니다.
job_max_runtime_seconds = 1800

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 20
required = false

[mcp_servers.firecrawl]
command = "powershell.exe"
args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".codex/mcp/firecrawl.ps1"]
startup_timeout_sec = 20
required = false

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
startup_timeout_sec = 20
required = false
